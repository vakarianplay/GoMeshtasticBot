name: Build releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux_amd64
            goos: linux
            goarch: amd64

          - target: linux_armv7
            goos: linux
            goarch: arm
            goarm: "7"

          - target: linux_arm64
            goos: linux
            goarch: arm64

          - target: linux_riscv64
            goos: linux
            goarch: riscv64

          - target: windows_amd64
            goos: windows
            goarch: amd64

    defaults:
      run:
        shell: bash

    env:
      CGO_ENABLED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          app="GoMeshtasticBot"
          binary="$app"
          archive="${app}_${TARGET}"
          package_dir="package/$app"

          if [[ "$GOOS" == "windows" ]]; then
            binary="${binary}.exe"
          fi

          mkdir -p "$package_dir" dist

          go build \
            -mod=readonly \
            -trimpath \
            -ldflags="-s -w" \
            -o "$package_dir/$binary" \
            .

          cp config.yml README.md "$package_dir/"

          for file in LICENSE LICENSE.md LICENSE.txt; do
            if [[ -f "$file" ]]; then
              cp "$file" "$package_dir/"
            fi
          done

          if [[ "$GOOS" == "windows" ]]; then
            (
              cd package
              zip -r "../dist/${archive}.zip" "$app"
            )
          else
            tar -czf "dist/${archive}.tar.gz" -C package "$app"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --title "GoMeshtasticBot $RELEASE_TAG" \
              --generate-notes
          fi
